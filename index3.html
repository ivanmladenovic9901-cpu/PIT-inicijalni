function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Funkcija koja NASUMIČNO proširuje 1 ili 2 netačna odgovora tako da budu DUŽI od tačnog
function processOptionsLength(correctText, wrongTexts) {
    const wrongCopy = [...wrongTexts];
    
    // Određujemo koliko netačnih odgovora proširujemo (1 ili 2)
    const countToExpand = Math.floor(Math.random() * 2) + 1; 
    
    // Nasumično biramo indekse netačnih odgovora za proširenje
    const expandedIndices = new Set();
    while(expandedIndices.size < countToExpand) {
        expandedIndices.add(Math.floor(Math.random() * wrongCopy.length));
    }

    // Proširujemo izabrane netačne odgovore dodavanjem fraza
    expandedIndices.forEach(idx => {
        const randomFiller = fillerPhrases[Math.floor(Math.random() * fillerPhrases.length)];
        wrongCopy[idx] = wrongCopy[idx] + randomFiller;
    });

    return {
        correct: correctText,
        wrong: wrongCopy
    };
}

    document.getElementById('quiz-container').classList.remove('hidden');
    document.getElementById('results-container').classList.add('hidden');

    const shuffledBank = shuffleArray(fullQuestionBank);
    const chosenRawQuestions = shuffledBank.slice(0, 15);

    selectedQuestions = chosenRawQuestions.map((qObj, index) => {
        // Obrađujemo dužine opcija (netačni odgovori bivaju produženi)
        const processed = processOptionsLength(qObj.correct, qObj.wrong);
        
        const allOptionsObj = [
            { text: processed.correct, isCorrect: true },
            { text: processed.wrong[0], isCorrect: false },
            { text: processed.wrong[1], isCorrect: false },
            { text: processed.wrong[2], isCorrect: false }
        ];

        const shuffledOptions = shuffleArray(allOptionsObj);
        
        const letters = ['a', 'b', 'c', 'd'];
        const optionsMap = {};
        let correctLetter = '';
        let correctText = '';

        shuffledOptions.forEach((opt, i) => {
            const letter = letters[i];
            optionsMap[letter] = opt.text;
            if (opt.isCorrect) {
                correctLetter = letter;
                correctText = opt.text;
            }
        });

        return {
            id: index,
            questionText: qObj.q,
            options: optionsMap,
            correctLetter: correctLetter,
            correctText: correctText
        };
    });

    renderQuestions();
    startTimer();
}

function renderQuestions() {
    const listContainer = document.getElementById('questions-list');
    listContainer.innerHTML = '';

    selectedQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        ['a', 'b', 'c', 'd'].forEach(letter => {
            optionsHTML += `
                <label class="option-label">
                    <input type="radio" name="q_${q.id}" value="${letter}" onchange="recordAnswer(${q.id}, '${letter}')">
                    <span><strong>${letter.toUpperCase()})</strong> ${q.options[letter]}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <h3>${idx + 1}. ${q.questionText}</h3>
            <div class="options-group">${optionsHTML}</div>
        `;
        listContainer.appendChild(card);
    });
}

function recordAnswer(questionId, selectedLetter) {
    userAnswers[questionId] = selectedLetter;
}

function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("Vreme je isteklo! Test će se automatski završiti.");
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    document.getElementById('timer').textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

function resetTimer() {
    timeRemaining = 540;
    updateTimerDisplay();
}

function finishQuiz() {
    clearInterval(timerInterval);

    let score = 0;
    const reviewItems = [];

    selectedQuestions.forEach((q, idx) => {
        const userChoiceLetter = userAnswers[q.id];
        const isCorrect = userChoiceLetter === q.correctLetter;

        if (isCorrect) {
            score++;
        }

        const userChoiceText = userChoiceLetter ? q.options[userChoiceLetter] : "Nije odgovoreno";

        reviewItems.push({
            qNum: idx + 1,
            question: q.questionText,
            userChoiceText: userChoiceText,
            correctText: q.correctText,
            isCorrect: isCorrect
        });
    });

    const percentageVal = ((score / selectedQuestions.length) * 100).toFixed(1);

    document.getElementById('correct-count').textContent = score;
    document.getElementById('total-count').textContent = selectedQuestions.length;
    document.getElementById('percentage').textContent = `${percentageVal}%`;

    const reviewListDiv = document.getElementById('errors-list');
    reviewListDiv.innerHTML = '';

    reviewItems.forEach(item => {
        const card = document.createElement('div');
        
        if (item.isCorrect) {
            card.className = 'review-card correct-card';
            card.innerHTML = `
                <p><strong>${item.qNum}. Pitanje:</strong> ${item.question}</p>
                <p>Vaš odgovor: <span class="text-correct">✔ ${item.userChoiceText}</span></p>
            `;
        } else {
            card.className = 'review-card wrong-card';
            card.innerHTML = `
                <p><strong>${item.qNum}. Pitanje:</strong> ${item.question}</p>
                <p>Vaš odgovor: <span class="text-wrong">✖ ${item.userChoiceText}</span></p>
                <p>Tačan odgovor: <span class="text-correct">✔ ${item.correctText}</span></p>
            `;
        }
        reviewListDiv.appendChild(card);
    });

    document.getElementById('quiz-container').classList.add('hidden');
    document.getElementById('results-container').classList.add('hidden');
    document.getElementById('results-container').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
